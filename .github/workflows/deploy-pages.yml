# 首次运行前必须在仓库 Settings → Pages → Source 选「GitHub Actions」
# 详见 docs/deploy-pages.md
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GITHUB_PAGES: 'true'
  # 运行时自动拉取 Supabase 卡图清单（上传卡图后无需重新部署页面）
  VITE_ART_MANIFEST_URL: https://yjqkotqmglxjhlrhynsu.supabase.co/storage/v1/object/public/card-art/manifest.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Stamp OTA site version
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          printf '%s\n' \
            '/** OTA 网页构建版本 — CI 生成 */' \
            "export const SITE_OTA_VERSION = '${VERSION}';" \
            > src/site-build.ts

      - name: Install and build Pages
        run: npm ci && npm run build

      - name: Build OTA bundle
        run: node scripts/build-ota.mjs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
